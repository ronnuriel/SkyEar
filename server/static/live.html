<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SkyEar Live Tactical Map</title>
    <link rel="stylesheet" href="/static/live.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="panel">
        <header class="brand">
          <div>
            <h1>SkyEar Live</h1>
            <p>Passive acoustic tactical map</p>
          </div>
          <span id="connectionState" class="pill">connecting</span>
        </header>

        <section class="fusion-card">
          <div class="level" id="fusionLevel">LEVEL -</div>
          <div class="metrics">
            <div>
              <span>Confidence</span>
              <strong id="fusionConfidence">-</strong>
            </div>
            <div>
              <span>Tracks</span>
              <strong id="trackCount">0</strong>
            </div>
            <div>
              <span>Age</span>
              <strong id="updateAge">-</strong>
            </div>
          </div>
          <p id="fusionInterpretation">Waiting for server data...</p>
        </section>

        <section class="controls">
          <label><input id="toggleSectors" type="checkbox" /> Bearing sectors</label>
          <label><input id="toggleTrackEstimates" type="checkbox" checked /> Track estimates</label>
          <label><input id="toggleFollow" type="checkbox" checked /> Auto-fit until manual pan</label>
        </section>

        <section>
          <h2>Tracks</h2>
          <div id="trackList" class="list"></div>
        </section>

        <section>
          <h2>Stations</h2>
          <div id="stationList" class="list compact"></div>
        </section>

        <section class="selected">
          <h2>Selected</h2>
          <pre id="selectedDetails">Click a station or track.</pre>
        </section>
      </aside>

      <section class="map-wrap">
        <svg id="liveMap" viewBox="0 0 1000 1000" role="img" aria-label="SkyEar live tactical map">
          <rect class="map-bg" x="0" y="0" width="1000" height="1000"></rect>
          <g id="worldLayer">
            <g id="coverageLayer"></g>
            <g id="sectorLayer"></g>
            <g id="trackEstimateLayer"></g>
            <g id="stationLayer"></g>
            <g id="trackLayer"></g>
          </g>
        </svg>
        <div class="map-help">Drag to pan. Wheel to zoom. Data updates in-place every 500 ms.</div>
      </section>
    </main>
    <script src="/static/live.js"></script>
  </body>
</html>
