    local_dir: data/datasets/droneaudioset_hf
    license: unknown
    license_url: null
    license_notes: Review Hugging Face dataset card before redistribution or training.
    citation: null
    label_schema: path_metadata
    label_mapping:
      drone-only: drone
      background: background
    metadata_parser: droneaudioset
