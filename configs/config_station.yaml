station:
  id: station_001
  station_id: station_001
  name: Home Mac Test Node1
  latitude: 32.0853
  longitude: 34.7818
  altitude_m: 20.0
  heading_offset_deg: 0.0
  location_label: ""


audio:
  device_id: 1
  sample_rate: 48000
  channels: 2
  window_sec: 1.0
  highpass_hz: 300
  highpass_order: 4

detector:
  f0_min: 700
  f0_max: 1600
  max_freq: 6000
  min_harmonics: 3
  min_suspect_threshold: 16.0
  min_alert_threshold: 22.0
  calibration_seconds: 6.0
  min_alert_duration_sec: 2.0
  clear_after_sec: 3.0

detection:
  profile: conservative
  hf_watch_threshold: 0.50
  hf_candidate_threshold: 0.70
  hf_strong_threshold: 0.85
  ml_positive_threshold: 0.90
  single_mic_candidate_run_required: 2
  single_mic_strong_run_required: 3
  allow_single_mic_alert: false

stability:
  enabled: true
  history_windows: 3
  max_f0_std_hz: 180
  min_score_windows: 2

hf:
  enabled: true
  run_every_n_windows: 4
  threshold: 0.70
  max_age_sec: 6.0

harmonic:
  lock_enabled: true
  lock_min_duration_sec: 3.0
  lock_hold_sec: 5.0
  f0_jump_penalty: 0.5
  ridge_max_drift_hz: 80
  track_bandwidth_hz: 120
  noise_floor_rolling_median_sec: 10
  max_acoustic_age_sec: 6.0

mic_array:
  profile: volt2_dual_mic
  sync_mode: unsynchronized
  channel_mode: dual_mic

two_mic_direction:
  enabled: true
  spacing_m: 2.00
  left_channel: 0
  right_channel: 1
  low_hz: 700
  high_hz: 6000
  min_delay_us: 40
  min_peak_ratio: 1.2
  min_rms: 0.0005

direction:
  enabled: false
  array_radius_m: 0.12
  scan_step_deg: 10
  calibration_file: null
  min_beam_confidence_pct: 0.55
  min_peak_ratio: 1.3
  max_second_peak_ratio: 0.85
  reject_ambiguous_bearing: true
  bearing_smoothing_alpha: 0.25
  bearing_flip_hysteresis_windows: 3
  max_bearing_jump_deg: 60
  coast_hold_sec: 5.0
  show_unreliable_bearing: false
  poor_bearing_sector_width_deg: 60
  good_bearing_sector_width_deg: 18

recording:
  enabled: true
  root: runtime/recordings
  chunk_sec: 60
  format: wav
  auto_record_on_candidate: false
  pre_roll_sec: 10
  max_session_sec: 3600
  max_disk_gb: 20
  local_control_enabled: true
  local_control_host: 127.0.0.1
  local_control_port: 8765

server:
  url: http://127.0.0.1:8080/events
  send_interval_sec: 0.5

heartbeat:
  enabled: true
  interval_sec: 5.0

local_monitor:
  enabled: true
  directory: runtime/stations
  state_path: runtime/stations/station_001_latest.json
  history_path: runtime/stations/station_001_history.jsonl
  waveform_points: 1200
  history_max_rows: 2000
