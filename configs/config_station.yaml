# station:
#   station_id: station_001
#   name: Home Mac Test Node
#   latitude: 32.0853
#   longitude: 34.7818
#   altitude_m: 20.0

station:
  station_id: station_001
  name: Home Mac Test Node2
  latitude: 32.0853
  longitude: 34.7818
  altitude_m: 20.0

audio:
  device_id: 0
  sample_rate: 44100
  channels: 1
  window_sec: 2.0

detector:
  f0_min: 500
  f0_max: 2200
  max_freq: 7000
  min_harmonics: 3
  min_suspect_threshold: 14.0
  min_alert_threshold: 22.0
  calibration_seconds: 8.0
  min_alert_duration_sec: 3.0
  clear_after_sec: 2.5

stability:
  enabled: true
  history_windows: 4
  max_f0_std_hz: 80
  min_score_windows: 3

hf:
  enabled: true
  model_id: preszzz/drone-audio-detection-05-17-trial-0
  run_every_n_windows: 2
  threshold: 0.70
  fallback_drone_label_idx: 1

mic_array:
  profile: mac_builtin_mono
  sync_mode: mono
  channel_mode: mono

direction:
  enabled: false
  array_radius_m: 0.12
  scan_step_deg: 10

server:
  url: http://127.0.0.1:8080/events
  send_interval_sec: 0.5
