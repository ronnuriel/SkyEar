station:
  id: station_002
  station_id: station_002
  name: Home Mac Test Node2
  latitude: 32.0853
  longitude: 34.7818
  altitude_m: 20.0
  heading_offset_deg: 0.0
  location_label: ""
  coverage_radius_m: 250.0

audio:
  device_id: 3
  sample_rate: 44100
  channels: 1
  window_sec: 1.0

detector:
  f0_min: 700
  f0_max: 1600
  max_freq: 6000
  min_harmonics: 3
  min_suspect_threshold: 16.0
  min_alert_threshold: 22.0
  calibration_seconds: 6.0
  min_alert_duration_sec: 2.0
  clear_after_sec: 3.0

detection:
  profile: conservative
  hf_watch_threshold: 0.50
  hf_candidate_threshold: 0.70
  hf_strong_threshold: 0.85
  ml_positive_threshold: 0.90
  single_mic_candidate_run_required: 2
  single_mic_strong_run_required: 3
  allow_single_mic_alert: false

stability:
  enabled: true
  history_windows: 3
  max_f0_std_hz: 180
  min_score_windows: 2

hf:
  enabled: true
  run_every_n_windows: 4
  threshold: 0.70

mic_array:
  profile: mac_builtin_mono
  sync_mode: mono
  channel_mode: mono

direction:
  enabled: false
  array_radius_m: 0.12
  scan_step_deg: 10

server:
  url: http://127.0.0.1:8080/events
  send_interval_sec: 0.5

local_monitor:
  enabled: true
  directory: runtime/stations
  state_path: runtime/stations/station_002_latest.json
  history_path: runtime/stations/station_002_history.jsonl
  waveform_points: 1200
  history_max_rows: 2000
